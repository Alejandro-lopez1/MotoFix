services:
  - type: web
    name: motofix-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "motofix-backend-iwky.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://motofix-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://motofix-frontend.onrender.com"
      - key: DJANGO_SETTINGS_MODULE
        value: "core.settings"

  - type: web
    name: motofix-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    buildArgs:
      VITE_API_URL: "https://motofix-backend-iwky.onrender.com"
    envVars:
      - key: VITE_API_URL
        value: "https://motofix-backend-iwky.onrender.com"
