services:
  - type: web
    name: motofix-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ENVIRONMENT
        value: "production"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://motofix-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://motofix-backend-iwky.onrender.com,https://motofix-frontend.onrender.com"
      - key: DJANGO_SETTINGS_MODULE
        value: "core.settings"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@motofix.com"
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: motofix-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_URL
        value: "https://motofix-backend-iwky.onrender.com/api"
