
services:
  db:
    image: postgres:16-alpine
    container_name: motofix-db
    environment:
      POSTGRES_DB: motofix
      POSTGRES_USER: motofix
      POSTGRES_PASSWORD: motofix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motofix"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motofix-backend
    command: sh -c "python manage.py migrate && python manage.py shell -c \"from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.filter(username='admin').exists() or User.objects.create_superuser('admin', 'admin@motofix.com', 'admin123')\" && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    environment:
      SECRET_KEY: django-insecure-docker-dev-key-change-in-prod
      DATABASE_URL: postgres://motofix:motofix@db:5432/motofix
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:3000,http://localhost:5173,http://127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "http://localhost,http://localhost:3000,http://localhost:5173,http://127.0.0.1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: motofix-frontend
    volumes:
      - ./frontend/src:/app/src
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:

